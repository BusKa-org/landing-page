server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"                  always;
    add_header X-Content-Type-Options   "nosniff"                     always;
    add_header X-XSS-Protection         "1; mode=block"               always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # CSP: only allow fonts from Google, no inline scripts, no framing
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none';" always;

    # ── Compression ───────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript text/html image/svg+xml;

    # ── Caching ───────────────────────────────────────────────────
    location ~* \.(css|js|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-apply security headers for this location block
        add_header X-Frame-Options        "SAMEORIGIN"     always;
        add_header X-Content-Type-Options "nosniff"        always;
    }

    # ── Routing ───────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }
}
