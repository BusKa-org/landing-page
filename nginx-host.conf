# /etc/nginx/sites-available/buska
# Serves buska.lsd.ufcg.edu.br — reverse proxies /landing-page to the Docker container.

server {
    listen 80;
    server_name buska.lsd.ufcg.edu.br;

    # ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name buska.lsd.ufcg.edu.br;

    ssl_certificate     /etc/letsencrypt/live/buska.lsd.ufcg.edu.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buska.lsd.ufcg.edu.br/privkey.pem;

    # TLS 1.2 + 1.3 only, modern cipher list
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    server_tokens off;

    # HSTS (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # Redirect /landing-page (no trailing slash) → /landing-page/
    location = /landing-page {
        return 301 /landing-page/;
    }

    # Proxy to Docker container — strips /landing-page/ prefix
    location /landing-page/ {
        proxy_pass         http://127.0.0.1:3000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }
}
