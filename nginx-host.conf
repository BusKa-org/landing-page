# buska.lsd.ufcg.edu.br — static landing page under /landing-page/
# Serves files directly from /var/www/buska/landing-page (git checkout).
# Update with: sudo git -C /var/www/buska/landing-page pull

server {
    listen 80;
    listen [::]:80;
    server_name buska.lsd.ufcg.edu.br;

    server_tokens off;

    # ACME challenge must stay on HTTP so renewals keep working
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name buska.lsd.ufcg.edu.br;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/buska.lsd.ufcg.edu.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buska.lsd.ufcg.edu.br/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # NOTE: deliberately no Strict-Transport-Security. HSTS applies to the whole
    # hostname including other ports, and would force the plain-HTTP API on
    # :5000 to https, breaking it for anyone who visited this page.
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Block dotfiles (notably the .git dir inside the webroot)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location = /landing-page {
        return 301 /landing-page/;
    }

    location /landing-page/ {
        alias /var/www/buska/landing-page/;
        index index.html;
        try_files $uri $uri/ =404;

        # Sem isto nenhum Cache-Control e enviado e o navegador guarda o css por
        # heuristica, sem perguntar se mudou. Uma publicacao entrava no ar e o
        # visitante seguia vendo a pagina antiga. Com no-cache ele revalida
        # sempre, e o ETag faz a resposta ser um 304 vazio.
        add_header Cache-Control "no-cache" always;
    }
}
